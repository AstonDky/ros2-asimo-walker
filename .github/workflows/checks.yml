name: Controller checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check syntax, entry-point import and pure controller behavior
        run: python -B -m unittest discover -s tests -v

  ros-package:
    runs-on: ubuntu-latest
    container: ros:humble-ros-base
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install build and runtime dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-colcon-common-extensions python3-numpy python3-tk \
            ros-humble-ament-lint-auto ros-humble-ament-lint-common
      - name: Check declared package dependencies
        run: |
          source /opt/ros/humble/setup.bash
          rosdep update --rosdistro humble
          rosdep check --from-paths src --ignore-src --rosdistro humble
      - name: Build the ROS 2 package
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --packages-select robot_simulation_experiment
      - name: Verify installed imports and executable help
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          ros2 pkg executables robot_simulation_experiment
          python3 -c "import sys; sys.path.insert(0, 'install/robot_simulation_experiment/lib/robot_simulation_experiment'); import rclpy; import asimo_walker; import main"
          ros2 run robot_simulation_experiment main.py --help
